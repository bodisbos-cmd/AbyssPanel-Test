name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest httpx2
      - run: python -m compileall -q app tests
      - run: pytest -q
      - name: Check dashboard JavaScript syntax
        run: DATA_DIR=/tmp/abyss-js-check COOKIE_SECURE=0 python -c "import app.main as m; open('/tmp/abyss-dashboard.js','w').write(m.DASH_JS)" && node --check /tmp/abyss-dashboard.js
      - name: Build deployment image
        run: docker build --pull -t abysspanel-test:ci .
      - name: Smoke test the real container and Xray routes
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/abyss-smoke-data"
          docker run -d --name abysspanel-smoke -p 18080:8080 -e COOKIE_SECURE=0 -e ABYSS_TEST_MODE=1 -v "$RUNNER_TEMP/abyss-smoke-data:/data" abysspanel-test:ci
          cleanup() {
            docker logs abysspanel-smoke || true
            docker rm -f abysspanel-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          curl -fsS http://127.0.0.1:18080/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18080/login | grep -q 'خوش برگشتی'
          for path in /ws /httpupgrade; do
            status=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' -H 'Connection: Upgrade' -H 'Upgrade: websocket' "http://127.0.0.1:18080$path" || true)
            test "$status" != "502"
          done
          for path in /xhttp /xhttp-packet /xhttp-stream-up /xhttp-stream-one /xhttp-stream-up/probe /xhttp-stream-one/probe; do
            status=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$path" || true)
            test "$status" != "502"
          done
          if docker logs abysspanel-smoke 2>&1 | grep -q 'Xray startup failed'; then
            echo "Xray failed to start; see container logs above."
            exit 1
          fi
