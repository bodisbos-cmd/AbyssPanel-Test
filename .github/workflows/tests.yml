name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q app tests
      - run: pytest -q
      - name: Build deployment image
        run: docker build --pull -t void-test:ci .
      - name: Smoke test the real container and Xray routes
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/void-smoke-data"
          docker run -d --name void-smoke -p 18080:8080 -e COOKIE_SECURE=0 -e ABYSS_TEST_MODE=1 -v "$RUNNER_TEMP/void-smoke-data:/data" void-test:ci
          cleanup() {
            docker logs void-smoke || true
            docker rm -f void-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          curl -fsS http://127.0.0.1:18080/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18080/login | grep -q 'خوش برگشتی'
          for path in /ws /httpupgrade /trojan-ws /vmess-ws /connect /upgrade; do
            status=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' -H 'Connection: Upgrade' -H 'Upgrade: websocket' "http://127.0.0.1:18080$path" || true)
            test "$status" != "502"
          done
          for path in /xhttp /xhttp-packet; do
            status=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$path" || true)
            test "$status" != "502"
          done
          # These four XHTTP stream-up/stream-one variants timed out in real tunnel
          # smoke tests over the HTTP/1.1 edge, so keep them off by default.
          # Their absent listeners should not be mistaken for a gateway regression.
          for path in /xhttp-stream-up /xhttp-stream-one /xhttp-stream-up-alt /xhttp-stream-one-alt; do
            status=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$path" || true)
            test "$status" = "502"
          done
          if docker logs void-smoke 2>&1 | grep -q 'Xray startup failed'; then
            echo "Xray failed to start; see container logs above."
            exit 1
          fi
          # Exercise genuine VLESS handshakes and traffic over every transport,
          # not just an HTTP status code from the reverse-proxy route.
          docker cp scripts/smoke_transports.py void-smoke:/tmp/smoke_transports.py
          docker exec void-smoke python /tmp/smoke_transports.py
          # Confirm the app watchdog recovers Xray after the smoke script kills it.
          # Then restart the entire container and verify SQLite state on the volume.
          docker restart void-smoke >/dev/null
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health | grep -q '"xray":"running"'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          docker exec -i void-smoke python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("/data/panel.sqlite3", timeout=10)
          try:
              row = conn.execute(
                  "SELECT used_bytes, quota_bytes, enabled FROM clients WHERE name=?",
                  ("CI transport smoke",),
              ).fetchone()
          finally:
              conn.close()
          assert row is not None and row[0] > 0 and row[1] == 1 and row[2] == 0, row
          print("PASS persistent volume after container restart:", row)
          PY
