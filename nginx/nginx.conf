user abyss;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 60s;
    keepalive_requests 10000;
    server_tokens off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Reuse upstream TCP connections for the request-based XHTTP transports.
    # Keep the cache deliberately bounded for Railway's small container sizes.
    upstream xray_xhttp_auto {
        server 127.0.0.1:10003;
        keepalive 16;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    upstream xray_xhttp_packet {
        server 127.0.0.1:10004;
        keepalive 16;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    upstream xray_xhttp_stream_up {
        server 127.0.0.1:10005;
        keepalive 16;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    upstream xray_xhttp_stream_one {
        server 127.0.0.1:10006;
        keepalive 16;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    upstream xray_xhttp_stream_up_alt {
        server 127.0.0.1:10012;
        keepalive 16;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    upstream xray_xhttp_stream_one_alt {
        server 127.0.0.1:10013;
        keepalive 16;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    include /etc/nginx/conf.d/*.conf;
}
